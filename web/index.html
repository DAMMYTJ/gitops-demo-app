<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitOps demo app</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .meta { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; background: #e0e7ff; color: #3730a3; font-size: 13px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; font-size: 15px; }
    button { padding: 8px 14px; font-size: 15px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 0; border-bottom: 1px solid #e5e7eb; }
    li small { color: #9ca3af; margin-left: 8px; }
    #status { color: #b91c1c; font-size: 14px; min-height: 20px; }
  </style>
</head>
<body>
  <h1>GitOps demo app</h1>
  <div class="meta">
    Environment: <span class="badge" id="env">...</span>
    Version: <span class="badge" id="ver">...</span>
  </div>

  <form id="form">
    <input id="text" maxlength="200" placeholder="Write a note" required>
    <button type="submit">Add</button>
  </form>
  <div id="status"></div>
  <ul id="list"></ul>

  <script>
    const statusEl = document.getElementById("status");

    async function loadVersion() {
      try {
        const r = await fetch("/api/version");
        const d = await r.json();
        document.getElementById("env").textContent = d.environment;
        document.getElementById("ver").textContent = d.version;
      } catch (e) {
        statusEl.textContent = "Cannot reach the API";
      }
    }

    async function loadNotes() {
      const list = document.getElementById("list");
      try {
        const r = await fetch("/api/notes");
        if (!r.ok) throw new Error("not ready");
        const notes = await r.json();
        list.textContent = "";
        for (const n of notes) {
          const li = document.createElement("li");
          li.textContent = n.text;
          const small = document.createElement("small");
          small.textContent = n.created_at;
          li.appendChild(small);
          list.appendChild(li);
        }
        statusEl.textContent = "";
      } catch (e) {
        statusEl.textContent = "Database not ready yet. Try again in a moment.";
      }
    }

    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const input = document.getElementById("text");
      const r = await fetch("/api/notes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: input.value })
      });
      if (r.ok) { input.value = ""; loadNotes(); }
      else { statusEl.textContent = "Could not save the note"; }
    });

    loadVersion();
    loadNotes();
  </script>
</body>
</html>
